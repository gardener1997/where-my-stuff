# wheremystuff nginx 反向代理配置
# 安装: /etc/nginx/conf.d/wheremystuff.conf
# 重载: nginx -s reload

server {
    listen 80;
    server_name wheremystuff.local;  # 改为你的域名或 IP

    client_max_body_size 20M;  # 图片上传限制（后端默认 10MB）

    # 静态图片直接由 nginx 提供（可选优化，不配则走后端）
    # location /data/images/ {
    #     alias /path/to/wheremystuff/data/images/;
    #     expires 7d;
    #     add_header Cache-Control "public, immutable";
    # }

    # 其余全部代理到后端
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（如需 HMR 开发代理）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 上传超时
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
